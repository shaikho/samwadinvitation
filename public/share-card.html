<!DOCTYPE html>
<!-- Source for og-image.jpg (the WhatsApp / social link preview). Regenerate with: npm run og -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex" />
  <title>Share card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=block" rel="stylesheet" />
  <style>
    @font-face { font-family: 'Armelie'; src: url('fonts/Armelie-Regular.otf') format('opentype'); font-display: block; }
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      position: relative; color: #4a3b46;
      background:
        radial-gradient(60% 90% at 50% 50%, rgba(255,255,255,.6), transparent 70%),
        radial-gradient(40% 60% at 8% 100%, rgba(185,138,157,.3), transparent 70%),
        radial-gradient(40% 60% at 92% 0%, rgba(190,160,200,.35), transparent 70%),
        repeating-linear-gradient(0deg, rgba(110,80,110,.035) 0 1px, transparent 1px 4px),
        repeating-linear-gradient(90deg, rgba(110,80,110,.03) 0 1px, transparent 1px 4px),
        #e7dce6;
    }
    .border { position: absolute; inset: 18px; border: 1.5px dashed rgba(191,156,111,.6); border-radius: 6px; }
    .border::after { content: ''; position: absolute; inset: 7px; border: 1px solid rgba(250,246,239,.8); border-radius: 3px; }

    /* bridal-bouquet flowers: corner bouquets and eucalyptus garlands */
    .bq, .gl { position: absolute; z-index: 0; }
    .bq img, .gl img { display: block; width: 100%; height: auto; }
    .bq { top: 18px; width: 176px; }
    .bq.tl { left: 22px; }
    .bq.tr { right: 22px; transform: scaleX(-1); }
    .gl { bottom: 26px; width: 34px; -webkit-mask-image: linear-gradient(transparent, #000 15%); mask-image: linear-gradient(transparent, #000 15%); }
    .gl.bl { left: 32px; }
    .gl.br { right: 32px; transform: scaleX(-1); }
    .col, .wreath, .date-under { z-index: 1; }

    .wreath { position: absolute; left: 50%; top: 50%; width: 380px; height: 380px; margin: -205px 0 0 -190px; }
    .wreath > div > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .wreath > .logo { position: absolute; left: 50%; top: 50%; width: auto; height: 50%; aspect-ratio: 491 / 667; transform: translate(-50%, -52%); filter: drop-shadow(0 6px 10px rgba(93,90,69,.16)); }
    .date-under {
      position: absolute; left: 0; right: 0; top: 520px; text-align: center;
      font-family: 'Cinzel', serif; letter-spacing: .4em; font-size: 22px; color: #bf9c6f;
    }

    .col { position: absolute; top: 0; bottom: 0; width: 370px; display: flex; flex-direction: column; justify-content: center; gap: 6px; }
    .col.en { left: 58px; text-align: center; }
    .col.ar { right: 58px; text-align: center; direction: rtl; }
    .kicker { font-family: 'Cinzel', serif; font-size: 17px; letter-spacing: .3em; text-transform: uppercase; color: #9d6f85; }
    .ar .kicker { font-family: 'Amiri', serif; letter-spacing: 0; font-size: 26px; }
    .names { font-family: 'Armelie', cursive; font-size: 50px; line-height: 1.12; color: #45343f; margin: 16px 0 12px; }
    .names .amp-s { color: #bf9c6f; font-size: .7em; }
    .ar .names { font-family: 'Aref Ruqaa', serif; font-size: 56px; line-height: 1.35; }
    .rule { width: 140px; height: 1px; margin: 4px auto 10px; background: linear-gradient(90deg, transparent, #bf9c6f, transparent); }
    .line { font-family: 'Cormorant Garamond', serif; font-size: 25px; font-weight: 600; line-height: 1.3; }
    .line.soft { font-weight: 500; font-style: italic; color: #7c6a77; }
    .ar .line { font-family: 'Amiri', serif; font-size: 25px; line-height: 1.45; font-style: normal; }
    .line.venue { color: #8f5a73; }
  </style>
</head>
<body>
  <div class="border"></div>
  <div class="bq tl" data-art="bouquet"></div>
  <div class="bq tr" data-art="bouquetAlt"></div>
  <div class="gl bl" data-art="garland"></div>
  <div class="gl br" data-art="garland"></div>

  <div class="col en">
    <p class="kicker">Wedding Invitation</p>
    <p class="names">Sameer<br><span class="amp-s">&amp;</span> Waad</p>
    <div class="rule"></div>
    <p class="line">Tuesday, 20 October 2026</p>
    <p class="line soft">Doors open 7:00 PM</p>
    <p class="line venue">One View Hall · Mountain Rose Hotel</p>
    <p class="line soft">6th of October City · Giza</p>
  </div>

  <div class="wreath">
    <div data-art="wreath"></div>
    <svg class="logo" viewBox="106 113 491 667" aria-hidden="true"><use href="#logoPath" fill="url(#logoGreen)" /></svg>
  </div>
  <p class="date-under">20 · 10 · 2026</p>

  <div class="col ar" lang="ar">
    <p class="kicker">دعوة زفاف</p>
    <p class="names">سمير ووعد</p>
    <div class="rule"></div>
    <p class="line">الثلاثاء ٢٠ أكتوبر ٢٠٢٦</p>
    <p class="line soft">فتح الأبواب ٧:٠٠ مساءً</p>
    <p class="line venue">قاعة ون فيو · فندق ماونتن روز</p>
    <p class="line soft">مدينة السادس من أكتوبر · الجيزة</p>
  </div>

  </svg>

  <script src="js/art.js"></script>
  <script>
    document.querySelectorAll('[data-art]').forEach((el) => { el.innerHTML = Art[el.dataset.art](); });

    document.body.dataset.ready = '1';
  </script>
</body>
</html>
