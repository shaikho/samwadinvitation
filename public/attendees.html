<!DOCTYPE html>
<html lang="en">

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Guest list · Sameer & Waad</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet" />
  <style>
    @font-face { font-family: 'Armelie'; src: url('/fonts/Armelie-Regular.otf') format('opentype'); }
    :root { --linen: #f4eee3; --ink: #4b4a3c; --gold: #b8975f; --sage: #56664a; --line: #e2d6c2; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; background: var(--linen); color: var(--ink);
      font-family: 'Cormorant Garamond', 'Amiri', serif; font-size: 18px;
      background-image: repeating-linear-gradient(0deg, rgba(160,140,110,.05) 0 1px, transparent 1px 4px),
        repeating-linear-gradient(90deg, rgba(160,140,110,.04) 0 1px, transparent 1px 4px);
    }
    .wrap { max-width: 760px; margin: 0 auto; padding: 40px 16px 60px; }
    header { text-align: center; margin-bottom: 24px; }
    .logo { display: block; height: 72px; margin: 0 auto 4px; }
    h1 { margin: 4px 0 0; font-weight: 600; font-size: 26px; letter-spacing: .06em; }
    .stats { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 18px 0 8px; }
    .stat { background: #fbf7ef; border: 1px solid var(--line); border-radius: 14px; padding: 10px 18px; min-width: 120px; }
    .stat b { display: block; font-size: 34px; line-height: 1.1; color: var(--sage); }
    .toolbar { display: flex; gap: 8px; justify-content: space-between; align-items: center; flex-wrap: wrap; margin: 16px 0; }
    input[type=search] { flex: 1; min-width: 180px; height: 42px; padding: 0 14px; border: 1px solid var(--line); border-radius: 10px; background: #fff; font: inherit; }
    button { height: 42px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--gold); background: #fbf7ef; font: 600 16px 'Cormorant Garamond', serif; cursor: pointer; color: var(--ink); }
    table { width: 100%; border-collapse: collapse; background: #fbf7ef; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
    th, td { padding: 12px 14px; text-align: start; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: var(--sage); background: #f6efe2; }
    td.n { width: 48px; color: var(--gold); }
    td.name { font-family: 'Amiri', 'Cormorant Garamond', serif; font-size: 19px; unicode-bidi: plaintext; }
    td.when { white-space: nowrap; font-size: 15px; color: #6d6a58; }
    tr:last-child td { border-bottom: 0; }
    .empty { text-align: center; padding: 40px 10px; color: #6d6a58; font-style: italic; }
    .updated { font-size: 14px; color: #6d6a58; }
    @media (max-width: 520px) { td.when { white-space: normal; } th.lang, td.lang { display: none; } }
  </style>
</head>

      </svg>
      <h1>Guest list · قائمة الحضور</h1>
      <div class="stats">
        <div class="stat"><b id="total">–</b>RSVPs</div>
        <div class="stat"><b id="unique">–</b>Unique names</div>
      </div>
    </header>

    <div class="toolbar">
      <input type="search" id="q" placeholder="Search / بحث" />
      <button type="button" id="refresh">Refresh</button>
      <button type="button" id="csv">Download CSV</button>
    </div>
    <p class="updated" id="updated"></p>

    <table>
      <thead><tr><th>#</th><th>Name · الاسم</th><th class="lang">Lang</th><th>When</th></tr></thead>
      <tbody id="rows"><tr><td colspan="4" class="empty">Loading…</td></tr></tbody>
    </table>
  </div>

  <script>
    let data = [];
    const rows = document.getElementById('rows');
    const q = document.getElementById('q');

    function render() {
      const term = q.value.trim().toLowerCase();
      const list = data.map((d, i) => ({ ...d, i: i + 1 })).filter((d) => !term || d.name.toLowerCase().includes(term));
      document.getElementById('total').textContent = data.length;
      document.getElementById('unique').textContent = new Set(data.map((d) => d.name.trim().toLowerCase())).size;
      rows.replaceChildren();
      if (!list.length) {
        const tr = rows.insertRow();
        const td = tr.insertCell();
        td.colSpan = 4; td.className = 'empty';
        td.textContent = data.length ? 'No matches' : 'No RSVPs yet';
        return;
      }
      for (const d of list.reverse()) {
        const tr = rows.insertRow();
        const cells = [
          ['n', d.i],
          ['name', d.name],
          ['lang', (d.lang || '').toUpperCase()],
          ['when', new Date(d.at).toLocaleString('en-GB', { dateStyle: 'medium', timeStyle: 'short' })],
        ];
        for (const [cls, v] of cells) { const td = tr.insertCell(); td.className = cls; td.textContent = v; }
      }
    }

    async function load() {
      try {
        data = await (await fetch('/api/attendees', { cache: 'no-store' })).json();
        document.getElementById('updated').textContent = 'Updated ' + new Date().toLocaleTimeString('en-GB');
        render();
      } catch {
        document.getElementById('updated').textContent = 'Could not load the list.';
      }
    }

    document.getElementById('csv').addEventListener('click', () => {
      const esc = (v) => '"' + String(v).replace(/"/g, '""') + '"';
      const csv = '﻿' + ['#,Name,Lang,When', ...data.map((d, i) => [i + 1, esc(d.name), d.lang, d.at].join(','))].join('\n');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
      a.download = 'attendees.csv';
      a.click();
      URL.revokeObjectURL(a.href);
    });
    document.getElementById('refresh').addEventListener('click', load);
    q.addEventListener('input', render);
    load();
    setInterval(load, 20000);
  </script>
